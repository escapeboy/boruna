name: Bench compare

# PR-time performance checks, two jobs:
#
# - "Bench compare" runs the criterion (wall-clock) benches on the PR base and head on the
#   self-hosted runner and posts a sticky comment with the deltas. Informational only: on that
#   shared runner identical code moved by 10-40% between runs, so it no longer fails the job.
# - "Instruction count" runs benches/benches/instructions.rs under Valgrind (Gungraun) on base
#   and head and fails when a benchmark executes more than 3% more instructions. Instruction
#   counts do not depend on machine load, so this is the regression gate.
#
# Neither job is in branch protection's required checks. The path filter below skips PRs that
# change no Rust code.

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      # No Rust code: the website, its scripts, installers and the other workflows. The bench
      # compares identical code for these and only reports noise from the shared runner.
      - 'site/**'
      - 'scripts/**'
      - 'install.sh'
      - 'install.ps1'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site.yml'
      - '.github/workflows/smoke-musl.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-compare:
    name: Bench compare
    runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      - name: Bench base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # BASE_REF is the PR's target branch (master/main); it cannot
          # contain shell metacharacters because branch protection
          # restricts which branches can be PR targets.
          git fetch origin "$BASE_REF"
          git checkout "origin/$BASE_REF"
          # Enumerate the criterion bench targets explicitly so the lib's
          # default test harness (which does not know --save-baseline)
          # is skipped. Adding a new [[bench]] target requires updating
          # this list.
          cargo bench -p boruna-benches \
            --bench compile --bench vm_throughput --bench evidence \
            -- --save-baseline base

      - name: Bench PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # HEAD_SHA is a 40-char git oid extracted by GitHub from the
          # PR ref, not a user-supplied branch name; safe to checkout.
          git checkout "$HEAD_SHA"
          cargo bench -p boruna-benches \
            --bench compile --bench vm_throughput --bench evidence \
            -- --baseline base

      - name: Render comparison
        id: cmp
        run: |
          set -euo pipefail
          python3 .github/scripts/bench_compare.py \
            --criterion-dir target/criterion \
            --threshold 0.10 \
            --out comment.md \
            --regressed-out regressed.txt
          if [ -s regressed.txt ]; then
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post sticky comment
        env:
          # All untrusted PR-context values are funneled through env
          # vars (per GitHub workflow-injection guidance). The
          # existing PR number + repo slug are GitHub-controlled
          # numerics/identifiers, not attacker-controllable strings.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Use curl + jq instead of `gh` — the self-hosted runner
          # does not have the `gh` CLI installed (operator follow-up
          # tracked in post-1.0-execution-status memory). curl + jq
          # are standard on any Linux runner. The body lives on
          # disk and is JSON-encoded by jq -Rs; never interpolated
          # through shell.
          MARKER='<!-- bench-compare:sticky -->'
          {
            printf '%s\n' "$MARKER"
            cat comment.md
          } > body.md

          api() {
            # Wrapper: standard GitHub REST headers + bearer auth +
            # fail-on-error. $1 = method, $2 = path-after-/repos.
            # Optional stdin = JSON body (for non-GET).
            local method="$1"
            local path="$2"
            local url="https://api.github.com/${path}"
            if [ "$method" = GET ]; then
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"
            else
              curl -fsSL -X "$method" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "$url"
            fi
          }

          # Find the existing sticky comment (if any) by marker
          # prefix. --arg passes MARKER as a jq variable; never
          # shell-interpolated into the jq script.
          existing=$(api GET "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" \
                '.[] | select(.body | startswith($marker)) | .id' \
            | head -1)

          # Build a {"body": "..."} JSON payload from body.md.
          # jq -Rs reads the file as one raw string and properly
          # escapes newlines, quotes, and any other JSON-significant
          # chars — safer than shell-quoting comment.md.
          payload=$(jq -Rs '{body: .}' < body.md)

          if [ -n "$existing" ]; then
            # `existing` is a numeric comment ID returned by GitHub —
            # not an attacker-controllable string. Safe to interp.
            printf '%s' "$payload" \
              | api PATCH "repos/$REPO/issues/comments/$existing" \
              > /dev/null
          else
            printf '%s' "$payload" \
              | api POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              > /dev/null
          fi

      # Wall-clock numbers stay as an informational PR comment only. On the shared self-hosted
      # runner identical code moved by 10-40% between runs (PRs #90-#96), so they cannot gate a
      # merge. The "Instruction count" job below is the regression gate.
      - name: Note wall-clock regressions (informational)
        if: steps.cmp.outputs.regressed == 'true'
        run: |
          echo "::warning::Wall-clock benchmarks moved by >= 10%. These numbers are noisy on this runner;"
          echo "see the Instruction count job for the regression check."

  instructions:
    # Counts executed instructions under Valgrind (benches/benches/instructions.rs). The count
    # does not depend on machine load, so a hosted runner is fine and a change means the code
    # changed. Fails when any benchmark executes more than 3% more instructions than the base.
    name: Instruction count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/gungraun-runner
            target
          key: ${{ runner.os }}-instructions-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-instructions-

      - name: Measure base and head
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The runner binary must match the gungraun library version of the checkout.
          install_runner() {
            version=$(cargo metadata --format-version=1 --locked \
              | jq -r '.packages[] | select(.name == "gungraun") | .version')
            if [ "$(gungraun-runner --version 2>/dev/null | awk '{print $2}')" != "$version" ]; then
              cargo install gungraun-runner --version "$version" --locked
            fi
          }
          # Fail if the harness ran but measured nothing (it once did, and passed green).
          bench() {
            cargo bench --locked -p boruna-benches --bench instructions -- "$@" 2>&1 | tee bench.log
            grep -q '^Gungraun result:' bench.log || { echo "::error::no instruction benchmarks were measured"; exit 1; }
            # A benchmark that counts 0 instructions measured nothing; comparing against it
            # reports every head benchmark as "+inf%".
            if sed 's/\x1b\[[0-9;]*m//g' bench.log | grep -Eq '^ *Instructions: +0\|'; then
              echo "::error::an instruction benchmark measured 0 instructions"; exit 1
            fi
          }

          # Results cached with `target` from earlier runs must not mix with this run's.
          rm -rf target/gungraun

          git fetch origin "$BASE_REF"
          git checkout "origin/$BASE_REF"
          if [ -f benches/benches/instructions.rs ]; then
            install_runner
            bench --save-baseline=base
            git checkout "$HEAD_SHA"
            install_runner
            # Exit code 3 = at least one benchmark executed > 3% more instructions.
            bench --baseline=base --callgrind-limits='ir=3%'
          else
            echo "Base has no instruction benchmarks yet; recording head only (no comparison)."
            git checkout "$HEAD_SHA"
            install_runner
            bench
          fi
