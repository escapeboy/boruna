name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: |
          # Remove the binary before building so Cargo always produces a fresh
          # copy. Self-hosted runners persist target/ between runs; stale
          # fingerprints can mark the binary as up-to-date even when the file
          # is absent, causing integration tests that use CARGO_BIN_EXE_boruna
          # to fail with "No such file or directory".
          rm -f target/debug/boruna
          cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build with http feature
        run: cargo build --workspace --features boruna-vm/http

      - name: Run tests with http feature
        run: cargo test -p boruna-vm --features http

      - name: Validate example workflows
        run: |
          for dir in examples/workflows/*/; do
            cargo run --bin boruna -- workflow validate "$dir"
          done

      - name: Smoke-test example workflows end-to-end
        # Sprint W9-D: catches integration regressions where DAG validation
        # passes but execution fails (compile errors in .ax sources,
        # capability gating bugs, bundle-write failures). For each example,
        # we RUN the workflow with --policy allow-all --record, then
        # `evidence verify` the produced bundle.
        #
        # Why allow-all: examples ship with stub capability handlers in demo
        # mode, so allow-all is safe and exercises the gating code path.
        # We do NOT pass --live; no real network, db, or LLM calls.
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          for dir in examples/workflows/*/; do
            example=$(basename "$dir")
            echo "=== smoke: $example ==="
            DATA_DIR="$SMOKE_DIR/$example"
            EV_DIR="$DATA_DIR/evidence"
            mkdir -p "$DATA_DIR"
            cargo run --bin boruna -- workflow run "$dir" \
              --policy allow-all \
              --record \
              --data-dir "$DATA_DIR" \
              --evidence-dir "$EV_DIR"
            # Bundles land at $EV_DIR/<run-id>/.
            run_id=$(ls "$EV_DIR" | head -1)
            if [ -z "$run_id" ]; then
              echo "ERROR: no run produced for $example" >&2
              exit 1
            fi
            cargo run --bin boruna -- evidence verify "$EV_DIR/$run_id"
          done

      - name: Compile benches (no-run)
        # Sprint W8: regression-gate the criterion bench harness so a
        # bench refactor that breaks compilation surfaces at PR time.
        # We do NOT execute benches in CI — bench TIMING data is the
        # operator's job to capture on a representative production-class
        # machine; see docs/PERFORMANCE.md for the workflow. Compile-only
        # adds <30s on a warm cache.
        run: cargo bench -p boruna-benches --no-run

  blob-integration:
    name: Blob integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-blob-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-blob-

      - name: S3 integration tests (MinIO via testcontainers)
        run: cargo test -p boruna-orchestrator --features s3-it -- --test-threads=1
      # GCS integration tests omitted: object_store GCS adapter uses the GCS XML/S3-compatible
      # API but fake-gcs-server only implements the GCS JSON API. Run manually with a real
      # GCS endpoint and GOOGLE_SERVICE_ACCOUNT_KEY set.

  platforms:
    # Boruna ships binaries for macOS (arm64, x86_64), Windows (x64, arm64) and Linux
    # (x86_64, arm64). The jobs above run on one Linux x86_64 machine, so this one builds,
    # tests and runs a real workflow on each of the other platforms, natively. Without it a
    # Unix-only assumption (a device path, a file mode, a path separator) only shows up when a
    # user on that platform hits it.
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14 }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: platform-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        shell: bash
        run: cargo build --workspace --locked

      - name: Run tests
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast

      - name: Diagnose a failing subcommand (Windows only)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          for args in "lang codes" "doctor --json" "size --json"; do
            echo "== boruna $args"
            ./target/debug/boruna.exe $args >/tmp/out.txt 2>/tmp/err.txt
            echo "exit code: $?"
            echo "stdout bytes: $(wc -c </tmp/out.txt)"
            head -c 600 /tmp/err.txt
          done

      - name: Packaging tools used by release.yml (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir pkgcheck && cp target/debug/boruna.exe pkgcheck/
          pwsh -NoProfile -Command "Compress-Archive -Path 'pkgcheck' -DestinationPath 'pkgcheck.zip'"
          sha256sum pkgcheck.zip

      - name: Installer tests (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
            shellcheck install.sh scripts/test-install.sh
          fi
          sh scripts/test-install.sh
          # The published release, end to end, exactly as the README tells users to run it.
          BORUNA_INSTALL_DIR="$RUNNER_TEMP/boruna-bin" sh install.sh
          "$RUNNER_TEMP/boruna-bin/boruna" --version

      - name: Installer tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 tests failed under PowerShell 7' }
          powershell -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 tests failed under Windows PowerShell 5.1' }
          # The published release, end to end, exactly as the README tells users to run it.
          $env:BORUNA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'boruna-bin'
          Get-Content -Raw install.ps1 | Invoke-Expression
          & (Join-Path $env:BORUNA_INSTALL_DIR 'boruna.exe') --version
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $env:BORUNA_INSTALL_DIR)) {
            throw 'install.ps1 did not add the install folder to the user PATH'
          }

      - name: Smoke test (version, workflow run, evidence verify)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q --locked --bin boruna -- --version
          out="$(mktemp -d)"
          cargo run -q --locked --bin boruna -- workflow run examples/workflows/confidence_gated_review \
            --policy allow-all --record --data-dir "$out" --evidence-dir "$out/evidence"
          run_id="$(ls "$out/evidence" | head -1)"
          cargo run -q --locked --bin boruna -- evidence verify "$out/evidence/$run_id"

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy with http feature
        run: cargo clippy --workspace --features boruna-vm/http --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
